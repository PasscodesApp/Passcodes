plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.jeeldobariya.passcodes.autofill'
version = '0.1.0'

android {
  namespace "com.jeeldobariya.passcodes.autofill"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Required standard Expo Module core library
  implementation project(':expo-modules-core')

  // Shared native database layer (queries, saves, schema mirror). The
  // Autofill module never touches SQLite directly. The project name is
  // the folder name of the passcodes-native-database-service module.
  implementation project(':passcodes-native-database-service')

  implementation "androidx.core:core-ktx:1.19.1"
  
  implementation "com.google.android.material:material:1.14.0"
  implementation "androidx.coordinatorlayout:coordinatorlayout:1.3.0"
  
  // Optional: AndroidX Autofill helper library for field hint constants
  implementation 'androidx.autofill:autofill:1.3.0'

  // Preferences DataStore — backs the inline-suggestions toggle shared
  // between the native Autofill service and the RN module bridge.
  implementation "androidx.datastore:datastore-preferences:1.3.0-rc01"

  // BiometricPrompt for the "tap to unlock" flow in AutofillUnlockActivity.
  implementation 'androidx.biometric:biometric:1.4.0-alpha07'
}
